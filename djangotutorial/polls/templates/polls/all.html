<h1>Tous les sondages</h1>

{% if questions %}
    <ul>
    {% for question in questions %}
        <li>
            n°{{ question.id }} –
            <a href="{% url 'polls:detail' question.id %}">{{ question.question_text }}</a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>Aucun sondage pour l'instant.</p>
{% endif %}

<!--Un titre. Si des questions existent : une liste où, pour chaque question, on écrit son numéro, puis son texte sous forme de lien vers sa page de détail. Sinon : un message-->
